<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Sistema Point do Pipi</title>
<link rel="icon" href="img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Sistema de balcão: cada função vê só as próprias abas. Celular primeiro, botões grandes; o dashboard abre em duas colunas em telas largas. */
:root{
  --chapa:#121110; --chapa-2:#1c1a17; --chapa-3:#2c2823; --chapa-4:#3a352f;
  --papel:#f5ece0; --papel-2:#bfae9b;
  --laranja:#ff9312; --laranja-2:#ffb35c;
  --ok:#5fbf5a; --alerta:#f2c230; --critico:#e0472b; --info:#5aa9e6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--chapa);color:var(--papel);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2.tt{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:20px;margin:0}
.muted{color:var(--papel-2)}
.demo{background:var(--laranja);color:var(--chapa);font-weight:700;font-size:12.5px;text-align:center;padding:6px 14px}

/* ---------- topo e abas ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(18,17,16,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--chapa-3);padding-top:env(safe-area-inset-top,0px)}
.top .bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.top img{height:32px;width:auto}
.who{flex:1;min-width:0;line-height:1.2}
.who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--papel-2);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px;border:1px solid var(--chapa-3);background:var(--chapa-2);cursor:pointer;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--critico)}
.pill.ok i{background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--chapa-3);background:var(--chapa-2);border-radius:12px;padding:9px 13px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--laranja);background:rgba(255,147,18,.12);color:var(--laranja)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--critico);color:#fff;font-size:11.5px;display:inline-grid;place-items:center}
main{padding-block:16px 60px}

/* ---------- botões e campos ---------- */
.b{min-height:48px;border-radius:12px;border:1.5px solid var(--chapa-3);background:var(--chapa-2);font-weight:800;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 14px;text-align:center}
.b:active{transform:scale(.98)}
.b.go{background:var(--laranja);border-color:var(--laranja);color:var(--chapa)}
.b.wa{background:#173b22;border-color:#2c6b3c}
.b.no{color:#ff8a72}
.b.sm{min-height:38px;font-size:13px;padding:0 10px;border-radius:10px}
.b.w{width:100%}
.b[disabled]{opacity:.45;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px}
input.i,select.i,textarea.i{background:var(--chapa);border:1.5px solid var(--chapa-3);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--laranja);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--chapa-3);background:var(--chapa-2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--papel);color:var(--chapa);border-color:var(--papel)}
.card{background:var(--chapa-2);border:1px solid var(--chapa-3);border-radius:16px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.vazio{text-align:center;color:var(--papel-2);padding:36px 10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* ---------- entrada / login ---------- */
.entrada{max-width:520px;margin:0 auto;padding:28px 0 40px;display:flex;flex-direction:column;gap:16px}
.entrada .logo{width:220px;margin:0 auto 4px}
.pessoas{display:grid;gap:8px}
.pessoa{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--chapa-3);background:var(--chapa-2);cursor:pointer;text-align:left;width:100%}
.pessoa:hover{border-color:var(--laranja)}
.av{width:42px;height:42px;border-radius:50%;background:var(--chapa-3);display:grid;place-items:center;font-size:20px;flex:none}
.pessoa b{display:block}
.pessoa small{color:var(--papel-2)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--papel-2)}
.pin-dots i.on{background:var(--laranja);border-color:var(--laranja)}
.pin-dots.err i{border-color:var(--critico);animation:treme .3s}
@keyframes treme{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto;width:100%}
.keypad button{height:64px;border-radius:16px;border:1.5px solid var(--chapa-3);background:var(--chapa-2);font-size:24px;font-weight:800;cursor:pointer}
.keypad button:active{background:var(--chapa-3)}

/* ---------- pedidos ---------- */
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));align-items:start}
.ped{background:var(--chapa-2);border:1.5px solid var(--chapa-3);border-radius:16px;overflow:hidden}
.ped.novo{border-color:var(--laranja);animation:pisca 1.2s ease-in-out infinite}
.ped.atraso{border-color:var(--critico)}
@keyframes pisca{50%{box-shadow:0 0 0 4px rgba(255,147,18,.35)}}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--chapa-3)}
.ph .n{font-family:var(--display);font-size:22px;line-height:1}
.ph .meta{flex:1;min-width:0;font-size:12.5px;color:var(--papel-2)}
.ph .meta b{color:var(--papel);font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipo{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;border-radius:8px;background:var(--chapa-3);white-space:nowrap}
.tipo.entrega{background:rgba(90,169,230,.15);color:var(--info)}
.tipo.retirada{background:rgba(95,191,90,.15);color:var(--ok)}
.tipo.mesa{background:rgba(255,147,18,.15);color:var(--laranja)}
.tipo.balcao{background:rgba(242,194,48,.14);color:var(--alerta)}
.pb{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.itens li{display:flex;justify-content:space-between;gap:10px}
.itens li b{color:var(--laranja);margin-right:6px}
.itens li.op{display:block;font-size:13px;color:var(--papel-2);padding-left:26px;margin-top:-2px;font-weight:600}
.itens.big li.op{font-size:15px;color:var(--papel)}
.itens li.op.ob{color:#ff8a72;font-weight:700}
.itens.big li{font-size:18px;font-weight:800}
.obs{background:rgba(224,71,43,.12);border-left:3px solid var(--critico);padding:7px 10px;border-radius:6px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.kv dt{color:var(--papel-2)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:1px solid var(--chapa-3);padding-top:8px}
.total span:last-child{color:var(--laranja)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.acts .b.go,.acts .full{grid-column:1/-1}
.timer{font-weight:800;font-size:13px;padding:4px 8px;border-radius:8px;background:var(--chapa-3)}
.timer.alerta{background:rgba(242,194,48,.18);color:var(--alerta)}
.timer.critico{background:rgba(224,71,43,.2);color:#ff8a72}

/* ---------- mesas ---------- */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.mesa{aspect-ratio:1;max-width:100%;border-radius:16px;border:2px solid var(--chapa-3);background:var(--chapa-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.mesa .mn{font-family:var(--display);font-size:28px;line-height:1}
.mesa small{font-size:11.5px;font-weight:700;color:var(--papel-2);text-align:center}
.mesa.ocupada{border-color:var(--laranja);background:rgba(255,147,18,.08)}
.mesa.conta{border-color:var(--critico);background:rgba(224,71,43,.1)}
.mesa .st{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.mesa.livre .st{color:var(--ok)} .mesa.ocupada .st{color:var(--laranja)} .mesa.conta .st{color:#ff8a72}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--papel-2);margin-bottom:12px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- lançar itens (POS) ---------- */
.pos{display:grid;gap:12px}
@media (min-width:860px){.pos{grid-template-columns:1.4fr 1fr;align-items:start}}
.prods{display:grid;gap:8px}
.prod{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--chapa-2);border:1px solid var(--chapa-3)}
.prod .pn{flex:1;min-width:0}
.prod .pn b{display:block;font-size:14.5px}
.prod .pn small{color:var(--laranja);font-weight:800}
.prod.esg{opacity:.5}
.step{display:inline-flex;align-items:center;background:var(--chapa-3);border-radius:12px;overflow:hidden}
.step button{width:42px;height:42px;border:0;background:transparent;font-size:20px;font-weight:800;cursor:pointer}
.step span{min-width:24px;text-align:center;font-weight:800}
.resumo{position:sticky;top:120px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--chapa-2);border:1px solid var(--chapa-3);border-radius:16px;padding:14px;min-width:0}
.kpi small{display:block;color:var(--papel-2);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.kpi b{display:block;font-size:clamp(20px,5.5vw,28px);font-weight:800;margin:4px 0 2px;white-space:nowrap}
.kpi .d{font-size:12.5px;font-weight:700}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:#ff8a72}
.dgrid{display:grid;gap:12px;margin-top:12px}
@media (min-width:860px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .wide{grid-column:1/-1}}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{margin:0 0 12px;color:var(--papel-2);font-size:12.5px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--chapa-3);stroke-width:1}
.chart .ax{fill:var(--papel-2);font-size:11px;font-family:var(--body)}
.chart .bar{fill:var(--laranja)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart g:hover .bar{fill:var(--laranja-2)}
.hb{display:flex;flex-direction:column;gap:9px}
.hb .r{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:10px;font-size:13.5px;cursor:default}
.hb .r>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .t{height:12px;background:var(--chapa-3);border-radius:6px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--laranja);border-radius:0 4px 4px 0}
.hb .r:hover .t i{background:var(--laranja-2)}
.hb .v{font-weight:800;text-align:right;white-space:nowrap}
.hb .v small{color:var(--papel-2);font-weight:600;margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--papel-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--chapa-3)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--chapa-3)}
.tbl td.n,.tbl th.n{text-align:right}
.scroll-x{overflow-x:auto}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--papel);color:var(--chapa);font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);white-space:nowrap}

/* ---------- cardápio / equipe ---------- */
.lin{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--chapa-3)}
.lin:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--chapa-3);transition:background .2s}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--papel);transition:transform .2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:2px solid var(--laranja);outline-offset:2px}
.func{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--chapa-3);flex-wrap:wrap}
.func:last-child{border-bottom:0}
.func .fi{flex:1;min-width:150px}
.func .fi b{display:block}
.func .fi small{color:var(--papel-2)}
.link{font-family:var(--mono);font-size:12px;background:var(--chapa);border:1px dashed var(--chapa-3);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;user-select:all}

/* ---------- diálogos, toast, cupom ---------- */
dialog{border:1px solid var(--chapa-3);background:var(--chapa-2);color:var(--papel);border-radius:20px;padding:0;width:min(560px,calc(100vw - 24px));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:18px}
.st{font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--chapa)}
.st.ok{color:var(--ok)} .st.err{color:#ff8a72}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--papel);color:var(--chapa);font-weight:800;padding:12px 16px;border-radius:12px;z-index:70;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dlgCupom{background:transparent;border:0;width:min(380px,calc(100vw - 24px));overflow:visible}
.impressora{background:#2a2622;border-radius:16px 16px 6px 6px;height:26px;position:relative;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.impressora::after{content:"";position:absolute;left:12%;right:12%;bottom:6px;height:5px;border-radius:3px;background:#0b0a09}
.papel{position:relative;z-index:1;margin:-6px auto 0;width:88%;background:#fbfaf6;color:#111;font-family:var(--mono);font-size:11.5px;line-height:1.3;padding:14px 10px 18px;white-space:pre;overflow-x:auto;animation:sai 1.4s cubic-bezier(.3,.7,.3,1) both;max-height:66vh;overflow-y:auto}
@keyframes sai{from{clip-path:inset(0 0 100% 0);transform:translateY(-30px)}to{clip-path:inset(0 0 0 0);transform:none}}
.papel .bold{font-weight:700}
.papel .big{font-weight:700;transform:scaleY(1.6);margin:5px 0}
.papel .center{text-align:center}
.papel hr{border:0;border-top:2px dashed #bbb;margin:14px -10px}
.cupomBar{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cupomBar p{margin:0;text-align:center;font-size:12.5px;color:var(--papel-2);background:rgba(18,17,16,.85);padding:8px 10px;border-radius:10px}
#cupom{display:none}
@media print{
  @page{size:58mm auto;margin:0}
  body{background:#fff;color:#000}
  body>*:not(#cupom){display:none!important}
  #cupom{display:block;font-family:var(--mono);font-size:11px;line-height:1.25;width:58mm;padding:2mm;white-space:pre-wrap;color:#000}
  #cupom.w80{width:80mm;font-size:12px}
  #cupom .bold{font-weight:700} #cupom .big{font-size:15px;font-weight:700} #cupom .center{text-align:center}
}
</style>
</head>
<body>
<div class="demo">Protótipo · dados de exemplo, guardados só neste aparelho</div>
<div id="app"></div>

<dialog id="dlgImp">
  <div class="dlg">
    <h2 class="tt">Impressora</h2>
    <label class="f">Como imprimir
      <select class="i" id="metodo">
        <option value="tela">Mostrar o cupom na tela (demonstração)</option>
        <option value="ble">Bluetooth direto (Chrome no Android)</option>
        <option value="rawbt">App RawBT (Android, qualquer impressora Bluetooth)</option>
        <option value="serial">Computador com impressora pareada (Chrome)</option>
        <option value="navegador">Janela de impressão do navegador</option>
      </select>
    </label>
    <p class="muted" style="margin:0;font-size:12.5px" id="metodoHint"></p>
    <div class="row">
      <label class="f sp">Papel<select class="i" id="papel"><option value="58">58 mm</option><option value="80">80 mm</option></select></label>
      <label class="f sp">Vias<select class="i" id="vias"><option value="1">1 via</option><option value="2">2 vias</option></select></label>
    </div>
    <div class="st" id="impStatus"></div>
    <div class="row">
      <button class="b sp" type="button" id="btnConectar">🔗 Conectar</button>
      <button class="b sp" type="button" id="btnTeste">🧾 Imprimir teste</button>
    </div>
    <button class="b go" type="button" id="btnImpOk">Pronto</button>
  </div>
</dialog>

<dialog id="dlgCupom">
  <div class="impressora" aria-hidden="true"></div>
  <div class="papel" id="papelTela"></div>
  <div class="cupomBar"><p id="cupomMsg"></p><button class="b go" type="button" id="btnCupomOk">OK</button></div>
</dialog>

<div id="cupom"></div>
<div id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   DADOS DA LOJA (mesmo cardápio do link da bio)
   ===================================================================== */
const CFG = { loja:"POINT DO PIPI", sub:"O melhor da regiao", endereco:"Rua Diomedes Gomes Lopes, 321",
  tempoRetirada:"20 a 30 min", tempoEntrega:"40 a 60 min", mesas:12 };
const CATS = [["burgers","Burgers"],["combos","Combos"],["porcoes","Porções"],["bebidas","Bebidas"]];
const BASE = [
  {id:"classico",cat:"burgers",nome:"Pipi Clássico",preco:26.9},
  {id:"bacon",cat:"burgers",nome:"Bacon Lovers",preco:32.9},
  {id:"smash",cat:"burgers",nome:"Smash Duplo",preco:29.9},
  {id:"monstro",cat:"burgers",nome:"Monstrão",preco:42.9},
  {id:"c1",cat:"combos",nome:"Combo Clássico",preco:39.9},
  {id:"c2",cat:"combos",nome:"Combo Casal",preco:79.9},
  {id:"fritas",cat:"porcoes",nome:"Fritas da Casa",preco:18.9},
  {id:"fritas-cb",cat:"porcoes",nome:"Fritas Cheddar & Bacon",preco:26.9},

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);

const brl0 = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const hora = iso => new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

const foneFmt = d => d&&d.length===11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : (d||"");
const toast = t => { const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); };
const pick = a => a[Math.floor(Math.random()*a.length)];
const TIPO_NOME = {entrega:"Entrega",retirada:"Retirada",mesa:"Mesa",balcao:"Balcão"};

/* ======================= ARMAZENAMENTO (protótipo: localStorage) =======================
   Na versão final cada função abaixo vira uma consulta ao banco (Supabase) em tempo real,
   e aí cada funcionário usa o próprio celular. */
const S = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
            set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const DB = {

/* ======================= DADOS DE EXEMPLO ======================= */

  const sorteiaProd=()=>{ let t=pesos.reduce((s,x)=>s+x[1],0)*Math.random(); for(const [id,w] of pesos){ if((t-=w)<=0) return prods.find(p=>p.id===id);} return prods[0]; };
  const pedidosAntigos = forcar ? [] : DB.pedidos().filter(p=>!p.exemplo);
  const novos=[]; let num=0;
  const agora=new Date();
  for(let d=6; d>=0; d--){
    const dia=new Date(agora); dia.setDate(dia.getDate()-d);
    const fimSem=[5,6,0].includes(dia.getDay());

    for(let k=0;k<qtd;k++){
      let t=new Date(dia); t.setHours(11,0,0,0); t=new Date(t.getTime()+Math.pow(Math.random(),.7)*12.5*3600000);
      if(d===0 && t>new Date(agora.getTime()-8*60000)) continue;
      const r=Math.random(), tipo = r<.36?"entrega":r<.55?"retirada":r<.9?"mesa":"balcao";
      const itens=[]; const n=1+Math.floor(Math.random()*3);
      for(let j=0;j<n;j++){ const p=sorteiaProd(); const ex=itens.find(i=>i.id===p.id); if(ex) ex.qtd++; else itens.push({id:p.id,nome:p.nome,qtd:1,preco:p.preco}); }
      if(Math.random()<.5){ const ref=prods.find(p=>p.id==="refri"); itens.push({id:"refri",nome:ref.nome,qtd:1+Math.floor(Math.random()*2),preco:ref.preco}); }
      const sub=itens.reduce((s,i)=>s+i.qtd*i.preco,0), taxa=tipo==="entrega"?6:0;
      const pr=Math.random(), pag = pr<.45?"Pix":pr<.7?"Cartão de crédito":pr<.9?"Cartão de débito":"Dinheiro";
      const aceito=new Date(t.getTime()+(1+Math.random()*3)*60000), pronto=new Date(aceito.getTime()+(11+Math.random()*16)*60000);
      novos.push({ numero:0, criadoEm:t.toISOString(), status:Math.random()<.03?"recusado":"concluido", exemplo:true,
        tipo, cliente: tipo==="mesa"?"":pick(NOMES), fone: tipo==="entrega"||tipo==="retirada" ? "8799"+String(1000000+Math.floor(Math.random()*8999999)).slice(0,7) : "",
        endereco: tipo==="entrega"?{rua:pick(RUAS),numero:String(10+Math.floor(Math.random()*600)),bairro:pick(BAIRROS),ref:""}:null,
        mesa: tipo==="mesa"?1+Math.floor(Math.random()*CFG.mesas):null,
        itens, obs:pick(OBS), subtotal:sub, taxa, total:sub+taxa, pagamento:pag, troco:"",
        funcionario: tipo==="mesa"?pick(garcons):"carla", aceitoEm:aceito.toISOString(), prontoEm:pronto.toISOString(), pago:true, contaAberta:false });
    }
  }
  novos.sort((a,b)=>new Date(a.criadoEm)-new Date(b.criadoEm));
  // pedidos "ao vivo" de hoje
  const vivo=(minAtras,patch)=>{ const base=JSON.parse(JSON.stringify(novos[novos.length-1-Math.floor(Math.random()*6)])); Object.assign(base,{criadoEm:new Date(Date.now()-minAtras*60000).toISOString(),aceitoEm:null,prontoEm:null},patch); novos.push(base); };
  vivo(14,{tipo:"mesa",mesa:3,cliente:"",fone:"",troco:"",endereco:null,taxa:0,status:"aceito",funcionario:"joao",aceitoEm:new Date(Date.now()-13*60000).toISOString(),pago:false,contaAberta:true});
  vivo(26,{tipo:"mesa",mesa:5,cliente:"",fone:"",troco:"",endereco:null,taxa:0,status:"concluido",funcionario:"bia",aceitoEm:new Date(Date.now()-25*60000).toISOString(),prontoEm:new Date(Date.now()-9*60000).toISOString(),pago:false,contaAberta:true});
  vivo(6,{tipo:"mesa",mesa:5,cliente:"",fone:"",troco:"",endereco:null,taxa:0,status:"pronto",funcionario:"bia",aceitoEm:new Date(Date.now()-5*60000).toISOString(),prontoEm:new Date(Date.now()-1*60000).toISOString(),pago:false,contaAberta:true});
  vivo(9,{tipo:"entrega",mesa:null,funcionario:"carla",troco:"",status:"aceito",aceitoEm:new Date(Date.now()-8*60000).toISOString(),endereco:{rua:"Rua São José",numero:"118",bairro:"Centro",ref:"Portão azul"},cliente:"Fernanda",fone:"87991234567",pago:false});
  vivo(2,{tipo:"entrega",mesa:null,funcionario:null,status:"novo",cliente:"Lucas",fone:"87998887766",endereco:{rua:"Av. Rio Branco",numero:"52",bairro:"São Braz",ref:""},obs:"Sem cebola, por favor",pagamento:"Dinheiro",troco:"100",pago:false});
  for(const p of novos){ p.subtotal=p.itens.reduce((s,i)=>s+i.qtd*i.preco,0); p.taxa=p.tipo==="entrega"?6:0; p.total=p.subtotal+p.taxa; }
  const todos=[...novos,...pedidosAntigos].sort((a,b)=>new Date(a.criadoEm)-new Date(b.criadoEm));
  todos.forEach(p=>p.numero=++num);

  const mesas=[]; for(let i=1;i<=CFG.mesas;i++) mesas.push({n:i,status:"livre",abertaEm:null,garcom:null,pessoas:0});

  DB.setMesas(mesas);
  S.set("pipi-semeado",true);
}

/* ======================= CUPOM E IMPRESSORA ======================= */
const semAcento = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7E]/g,"");
function quebrar(txt,w){ const out=[]; let l=""; for(const p of semAcento(txt).split(/\s+/)){ if(!p) continue; if((l+" "+p).trim().length>w){ if(l) out.push(l); l=p; while(l.length>w){ out.push(l.slice(0,w)); l=l.slice(w);} } else l=(l+" "+p).trim(); } if(l) out.push(l); return out.length?out:[""]; }
function par(a,b,w){ a=semAcento(a); b=semAcento(b); const sp=w-a.length-b.length; return sp>=1 ? a+" ".repeat(sp)+b : a.slice(0,w-b.length-1)+" "+b; }
const v2 = n => Number(n||0).toFixed(2).replace(".",",");
const dataCupom = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(",","");

function cupomPedido(p,cols,via){
  const L=[], add=(t,o={})=>L.push({t:semAcento(t),...o}), sep=()=>add("-".repeat(cols));
  add(CFG.loja,{center:1,big:1}); add(CFG.sub,{center:1}); if(via) add(`(${via})`,{center:1}); sep();
  add(par(`PEDIDO ${nPed(p.numero)}`,dataCupom(p.criadoEm),cols),{bold:1});
  add(p.tipo==="mesa"?`*** MESA ${String(p.mesa).padStart(2,"0")} ***`:`*** ${TIPO_NOME[p.tipo].toUpperCase()} ***`,{center:1,big:1});
  if(p.funcionario){ const f=membro(p.funcionario); if(f) add(`Atendido por: ${f.nome}`); }
  sep();
  if(p.cliente) quebrar("Cliente: "+p.cliente,cols).forEach(t=>add(t));
  if(p.fone) add("Fone: "+foneFmt(p.fone));
  if(p.endereco){ quebrar(`End: ${p.endereco.rua}, ${p.endereco.numero}`,cols).forEach(t=>add(t,{bold:1})); quebrar("Bairro: "+p.endereco.bairro,cols).forEach(t=>add(t,{bold:1})); if(p.endereco.ref) quebrar("Ref: "+p.endereco.ref,cols).forEach(t=>add(t)); }
  if(p.cliente||p.fone||p.endereco) sep();
  for(const it of p.itens){ const preco=v2(it.qtd*it.preco); const ls=quebrar(`${it.qtd}x ${it.nome}`,cols-preco.length-1); add(par(ls[0],preco,cols),{bold:1}); ls.slice(1).forEach(t=>add("   "+t,{bold:1})); detalhes(it,cols,add); }
  if(p.obs){ sep(); quebrar("OBS: "+p.obs,cols).forEach(t=>add(t,{bold:1})); }
  sep(); add(par("Subtotal",v2(p.subtotal),cols)); if(p.taxa) add(par("Entrega",v2(p.taxa),cols));
  add(par("TOTAL","R$ "+v2(p.total),cols),{bold:1});
  if(p.tipo!=="mesa"){ quebrar("Pagamento: "+p.pagamento,cols).forEach(t=>add(t,{bold:1}));
    if(p.troco){ const t=Number(String(p.troco).replace(",",".")); add(`Troco para: R$ ${p.troco}`); if(t>p.total) add(`Levar de troco: R$ ${v2(t-p.total)}`,{bold:1}); } }
  sep(); add("Obrigado pela preferencia!",{center:1}); return L;
}
function cupomComanda(p,cols){
  const L=[], add=(t,o={})=>L.push({t:semAcento(t),...o}), sep=()=>add("=".repeat(cols));
  add("COMANDA COZINHA",{center:1,big:1}); sep();
  add(p.tipo==="mesa"?`MESA ${String(p.mesa).padStart(2,"0")}`:TIPO_NOME[p.tipo].toUpperCase(),{center:1,big:1});
  add(par(nPed(p.numero),hora(p.criadoEm),cols));
  const f=membro(p.funcionario); if(f) add("Garcom/atend.: "+f.nome);
  sep(); for(const it of p.itens){ quebrar(`${it.qtd}x ${it.nome}`,cols).forEach((t,i)=>add(i?"   "+t:t,{bold:1,big:cols>=40})); detalhes(it,cols,add,true); }
  if(p.obs){ sep(); quebrar("OBS: "+p.obs,cols).forEach(t=>add(t,{bold:1})); }
  sep(); return L;
}
function cupomConta(m,ped,cols){
  const L=[], add=(t,o={})=>L.push({t:semAcento(t),...o}), sep=()=>add("-".repeat(cols));
  add(CFG.loja,{center:1,big:1}); add("CONFERENCIA DE CONTA",{center:1}); sep();
  add(par(`MESA ${String(m.n).padStart(2,"0")}`,dataCupom(new Date().toISOString()),cols),{bold:1});
  const g=membro(m.garcom); if(g) add("Garcom: "+g.nome); if(m.pessoas) add("Pessoas: "+m.pessoas);
  sep();
  const ag={}; for(const p of ped) for(const it of p.itens){ const k=it.nome+"|"+it.preco+"|"+(it.opcoes||[]).join(","); ag[k]=ag[k]||{...it,qtd:0}; ag[k].qtd+=it.qtd; }
  let total=0; for(const it of Object.values(ag)){ total+=it.qtd*it.preco; add(par(`${it.qtd}x ${it.nome}`,v2(it.qtd*it.preco),cols)); (it.opcoes||[]).forEach(o=>quebrar("  + "+o,cols).forEach(t=>add(t))); }
  sep(); add(par("TOTAL","R$ "+v2(total),cols),{bold:1,big:1});
  if(m.pessoas>1) add(par(`Dividido por ${m.pessoas}`,"R$ "+v2(total/m.pessoas),cols));
  sep(); add("Nao e documento fiscal",{center:1}); add("Obrigado pela preferencia!",{center:1}); return L;
}
function detalhes(it,cols,add,forte){ (it.opcoes||[]).forEach(o=>quebrar("  + "+o,cols).forEach(t=>add(t,forte?{bold:1}:{}))); if(it.obs) quebrar("  OBS: "+it.obs,cols).forEach(t=>add(t,{bold:1})); }
function escpos(linhas,cols){
  const b=[], push=(...x)=>b.push(...x);
  push(0x1B,0x40);
  for(const l of linhas){ push(0x1B,0x61,l.center?1:0, 0x1B,0x45,l.bold||l.big?1:0, 0x1D,0x21,l.big?0x01:0x00); for(const ch of (l.big?l.t.slice(0,cols):l.t)) push(ch.charCodeAt(0)); push(0x0A); }
  push(0x1D,0x21,0,0x1B,0x45,0,0x1B,0x61,0, 0x0A,0x0A,0x0A,0x0A, 0x1D,0x56,0x42,0x00);
  return b;
}
const htmlCupom = ls => ls.map(l=>`<div class="${[l.bold&&"bold",l.big&&"big",l.center&&"center"].filter(Boolean).join(" ")}">${esc(l.t)||"&nbsp;"}</div>`).join("");

const pref=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem("painel-"+k); localStorage.setItem("painel-"+k,v); }catch(e){ return null; } };
const BLE_SERVICES=["000018f0-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000ff00-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb","0000ae30-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb"];
const Imp = {
  metodo:pref("metodo")||"tela", papel:pref("papel")||"58", vias:Number(pref("vias")||1), ble:null, serial:null,
  get cols(){ return this.papel==="80"?48:32; },
  conectado(){ return this.metodo==="ble"?!!(this.ble&&this.ble.device.gatt.connected):this.metodo==="serial"?!!this.serial:true; },
  async conectar(){
    if(this.metodo==="ble"){
      if(!navigator.bluetooth) throw new Error("Este navegador não tem Bluetooth. Use o Chrome no Android ou o app RawBT.");
      const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVICES});
      const server=await device.gatt.connect(); let alvo=null;
      for(const s of await server.getPrimaryServices()){ for(const c of await s.getCharacteristics()){ if(c.properties.write||c.properties.writeWithoutResponse){ alvo=c; break; } } if(alvo) break; }
      if(!alvo) throw new Error("A impressora não aceitou Bluetooth direto. Use o app RawBT.");
      device.addEventListener("gattserverdisconnected",()=>{ impStatus(); toast("Impressora desconectou."); });
      this.ble={device,char:alvo};
    } else if(this.metodo==="serial"){
      if(!navigator.serial) throw new Error("Use o Google Chrome no computador.");
      const port=await navigator.serial.requestPort(); await port.open({baudRate:9600}); this.serial=port;
    }
    impStatus();
  },
  async enviar(bytes){
    bytes=new Uint8Array(bytes);
    if(this.metodo==="ble"){ if(!this.conectado()) await this.conectar(); const c=this.ble.char, comResp=c.properties.write, tam=comResp?180:20;
      for(let i=0;i<bytes.length;i+=tam){ const parte=bytes.slice(i,i+tam); if(comResp) await c.writeValueWithResponse(parte); else { await c.writeValueWithoutResponse(parte); await new Promise(r=>setTimeout(r,12)); } } }
    else if(this.metodo==="serial"){ if(!this.serial) await this.conectar(); const w=this.serial.writable.getWriter(); await w.write(bytes); w.releaseLock(); }
    else if(this.metodo==="rawbt"){ let bin=""; bytes.forEach(x=>bin+=String.fromCharCode(x)); location.href="intent:base64,"+btoa(bin)+"#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;"; }
  },
  async imprimir(conjuntos,msg){ // conjuntos = array de arrays de linhas (cada um é uma via)
    if(this.metodo==="tela"){ mostrarCupom(conjuntos,msg); return; }
    if(this.metodo==="navegador"){ const el=$("#cupom"); el.className=this.papel==="80"?"w80":""; el.innerHTML=conjuntos.map(htmlCupom).join('<div style="page-break-after:always"></div>'); window.print(); return; }
    await this.enviar(conjuntos.flatMap(l=>escpos(l,this.cols)));
  }
};
async function imprimir(conjuntos,okMsg){
  try{ await Imp.imprimir(conjuntos,okMsg); if(Imp.metodo!=="tela") toast("Enviado para a impressora"); }
  catch(e){ mostrarCupom(conjuntos,"A impressora não pôde ser usada daqui (no link de demonstração o Bluetooth é bloqueado). Este é o cupom que sairia nela."); }
}
const imprimirPedido = p => imprimir((Imp.vias===2?["COZINHA",p.tipo==="entrega"?"ENTREGADOR":"BALCAO"]:[null]).map(v=>cupomPedido(p,Imp.cols,v)),"Assim o pedido sai na impressora da loja.");
const imprimirComanda = p => imprimir([cupomComanda(p,Imp.cols)],"Comanda que sai na impressora da cozinha.");
function mostrarCupom(conjuntos,msg){
  const el=$("#papelTela"); el.innerHTML=conjuntos.map(htmlCupom).join("<hr>");
  el.style.animation="none"; void el.offsetWidth; el.style.animation="";
  $("#cupomMsg").textContent=msg||"Assim sai na impressora da loja.";
  try{ $("#dlgCupom").showModal(); }catch(e){ $("#dlgCupom").setAttribute("open",""); } el.scrollTop=0;
}
$("#btnCupomOk").addEventListener("click",()=>$("#dlgCupom").close());
const HINTS={tela:"Para demonstrar: o cupom aparece na tela igual ao papel. Na loja, troque para Bluetooth direto ou App RawBT.",
  ble:"Abra no Google Chrome do Android, ligue o Bluetooth e toque em Conectar.",
  rawbt:"Instale o app gratuito RawBT na Play Store e pareie a impressora nele uma vez.",
  serial:"Pareie a impressora no Bluetooth do computador, abra no Chrome e toque em Conectar.",
  navegador:"Usa o driver da impressora instalado no computador."};
function impStatus(){

let audio=null;
function liberarSom(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); }catch(e){} try{ navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){} }
function bip(){ if(!audio) return; const t=audio.currentTime;
  [0,.22,.44].forEach((d,i)=>{ const o=audio.createOscillator(), g=audio.createGain(); o.type="square"; o.frequency.value=i===2?1320:988;
    g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.25,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.18); o.connect(g).connect(audio.destination); o.start(t+d); o.stop(t+d+.2); });
  try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }

/* ---------- DASHBOARD ---------- */
function janela(p){ const ini=new Date(); ini.setHours(0,0,0,0); const fim=new Date(ini); fim.setDate(fim.getDate()+1);
  if(p==="ontem"){ ini.setDate(ini.getDate()-1); fim.setDate(fim.getDate()-1); }
  if(p==="7d"){ ini.setDate(ini.getDate()-6); }
  return [ini,fim]; }
function vendasEntre(ini,fim){ return DB.pedidos().filter(p=>{ const t=new Date(p.criadoEm); return t>=ini&&t<fim&&p.status!=="recusado"&&p.status!=="novo"; }); }
function passo(v){ if(v<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; }
function barPath(x,y,w,h,r){ r=Math.min(r,w/2,h); if(h<=0) return ""; return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function grafBarras(dados){ // dados: [{rot, val, tip}]
  const estreito=innerWidth<600, W=estreito?360:640,H=estreito?210:230,L=estreito?40:52,R=8,T=10,B=26, bruto=Math.max(...dados.map(d=>d.val),1), st=passo(bruto/4), nt=Math.max(1,Math.ceil(bruto/st)), max=st*nt, n=dados.length, slot=(W-L-R)/n, bw=Math.min(36,slot*.62);
  const y=v=>T+(H-T-B)*(1-v/max); let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">`;
  for(let i=0;i<=nt;i++){ const v=st*i, yy=y(v); s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("pt-BR")+" mil":Math.round(v)}</text>`; }
  dados.forEach((d,i)=>{ const x=L+slot*i+(slot-bw)/2, yy=y(d.val), h=y(0)-yy;
    s+=`<g data-tip="${esc(d.tip)}"><rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}"/><path class="bar" d="${barPath(x,yy,bw,h,4)}"/></g>`;
    if(n<=(estreito?8:12)||i%2===0) s+=`<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.rot)}</text>`; });
  return s+"</svg>";
}
function barrasH(linhas,fmt){ const max=Math.max(...linhas.map(l=>l.val),1);
  return `<div class="hb">${linhas.map(l=>`<div class="r" data-tip="${esc(l.tip||"")}"><span>${esc(l.rot)}</span><span class="t"><i style="width:${(l.val/max*100).toFixed(1)}%"></i></span><span class="v num">${fmt(l.val)}${l.extra?`<small>${l.extra}</small>`:""}</span></div>`).join("")}</div>`; }
function vDash(){
  const [ini,fim]=janela(dashP), dur=fim-ini, fimAnt=dashP==="hoje"?new Date(Date.now()-86400000):new Date(fim-dur), ant=vendasEntre(new Date(ini-dur),fimAnt), v=vendasEntre(ini,fim);
  const fat=v.reduce((s,p)=>s+p.total,0), fatA=ant.reduce((s,p)=>s+p.total,0), ticket=v.length?fat/v.length:0, ticketA=ant.length?fatA/ant.length:0;
  const prep=v.filter(p=>p.aceitoEm&&p.prontoEm).map(p=>(new Date(p.prontoEm)-new Date(p.aceitoEm))/60000), tPrep=prep.length?prep.reduce((a,b)=>a+b,0)/prep.length:0;
  const delta=(a,b)=>{ if(!b) return `<span class="d muted">sem comparação</span>`; const d=(a-b)/b*100; return `<span class="d ${d>=0?"up":"down"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(0)}% vs ${dashP==="7d"?"7 dias antes":dashP==="ontem"?"anteontem":"ontem até esta hora"}</span>`; };
  // série temporal
  let serie=[], titulo="";
  if(dashP==="7d"){ titulo="Faturamento por dia";
    for(let i=0;i<7;i++){ const d=new Date(ini); d.setDate(d.getDate()+i); const vv=v.filter(p=>new Date(p.criadoEm).toDateString()===d.toDateString()), val=vv.reduce((s,p)=>s+p.total,0);
      const rot=d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""); serie.push({rot, val, tip:`${d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})}: ${brl(val)} · ${vv.length} pedidos`}); } }
  else { titulo="Faturamento por hora"; const hs=v.map(p=>new Date(p.criadoEm).getHours()); const h0=Math.min(17,...hs), h1=Math.max(23,...hs);
    for(let h=h0;h<=h1;h++){ const vv=v.filter(p=>new Date(p.criadoEm).getHours()===h), val=vv.reduce((s,p)=>s+p.total,0); serie.push({rot:h+"h",val,tip:`${h}h às ${h+1}h: ${brl(val)} · ${vv.length} pedidos`}); } }
  const canais=["entrega","retirada","mesa","balcao"].map(t=>{ const vv=v.filter(p=>p.tipo===t), val=vv.reduce((s,p)=>s+p.total,0); return {rot:TIPO_NOME[t]+(t==="entrega"||t==="retirada"?" (online)":""),val,extra:fat?` ${Math.round(val/fat*100)}%`:"",tip:`${vv.length} pedidos`}; }).sort((a,b)=>b.val-a.val);
  const pags=PAGAMENTOS.map(pg=>{ const vv=v.filter(p=>p.pagamento===pg), val=vv.reduce((s,p)=>s+p.total,0); return {rot:pg,val,extra:fat?` ${Math.round(val/fat*100)}%`:"",tip:`${vv.length} pedidos`}; }).sort((a,b)=>b.val-a.val);
  const qtd={}; v.forEach(p=>p.itens.forEach(i=>{ qtd[i.nome]=qtd[i.nome]||{q:0,v:0}; qtd[i.nome].q+=i.qtd; qtd[i.nome].v+=i.qtd*i.preco; }));
  const top=Object.entries(qtd).sort((a,b)=>b[1].q-a[1].q).slice(0,6).map(([n,o])=>({rot:n,val:o.q,tip:brl(o.v)+" em vendas"}));
  const eq=DB.equipe().filter(e=>e.funcao==="garcom"||e.funcao==="atendente").map(e=>{ const vv=v.filter(p=>p.funcionario===e.id); return {e,n:vv.length,val:vv.reduce((s,p)=>s+p.total,0)}; }).sort((a,b)=>b.val-a.val);
  const ocup=DB.mesas().filter(m=>m.status!=="livre").length, abertos=DB.pedidos().filter(p=>p.status==="aceito"||p.status==="novo").length;
  return `<div class="sec-h"><div class="chips">${[["hoje","Hoje"],["ontem","Ontem"],["7d","Últimos 7 dias"]].map(([k,n])=>`<button class="chip ${k===dashP?"on":""}" type="button" data-act="dashp" data-p="${k}">${n}</button>`).join("")}</div>
      <span class="muted num" style="font-size:12.5px">Agora: ${ocup} mesa(s) ocupada(s) · ${abertos} pedido(s) em aberto</span></div>
    <div class="kpis">
      <div class="kpi"><small>Faturamento</small><b class="num">${brl(fat)}</b>${delta(fat,fatA)}</div>
      <div class="kpi"><small>Pedidos</small><b class="num">${v.length}</b>${delta(v.length,ant.length)}</div>
      <div class="kpi"><small>Ticket médio</small><b class="num">${brl(ticket)}</b>${delta(ticket,ticketA)}</div>
      <div class="kpi"><small>Tempo de preparo</small><b class="num">${tPrep?Math.round(tPrep)+" min":"—"}</b><span class="d muted">média, do aceite ao pronto</span></div>
    </div>

      <section class="card"><h3>Formas de pagamento</h3><p class="sub">Confira com o fechamento do caixa</p>${barrasH(pags,brl0)}</section>
      <section class="card"><h3>Mais vendidos</h3><p class="sub">Em unidades</p>${top.length?barrasH(top,n=>n+" un"):`<p class="muted">Sem vendas no período.</p>`}</section>

        <div class="scroll-x"><table class="tbl"><thead><tr><th>Nome</th><th>Função</th><th class="n">Pedidos</th><th class="n">Vendas</th></tr></thead>
        <tbody>${eq.map(x=>`<tr><td>${esc(x.e.nome)}</td><td class="muted">${FUNCOES[x.e.funcao].nome}</td><td class="n num">${x.n}</td><td class="n num">${brl0(x.val)}</td></tr>`).join("")}</tbody></table></div></section>

  if(!user) return;
  const agora=relevantes();
  if(vistos){ const novos=[...agora].filter(x=>!vistos.has(x)); if(novos.length){ bip(); toast(user.funcao==="cozinha"?"🔔 Pedido novo na cozinha!":user.funcao==="garcom"?"🔔 Pedido pronto para servir!":"🔔 Pedido novo!"); } }
  vistos=agora;
  atualizarBadges();
  const ativo=document.activeElement, digitando=ativo&&/INPUT|TEXTAREA|SELECT/.test(ativo.tagName);
  const livre=!digitando && !document.querySelector("dialog[open]");
  if(livre && (["dash","pedidos","cozinha","servir"].includes(view) || (view==="mesas"&&!mesaAberta))) conteudo();
}
setInterval(tique,3000);
setInterval(()=>{ if(user&&["pedidos","cozinha","servir"].includes(view)&&relevantes().size&&user.funcao!=="gerente") bip(); },8000);
addEventListener("storage",e=>{ if(e.key==="pipi-pedidos") tique(); });

semear(false);
rota();
})();
</script>
</body>
